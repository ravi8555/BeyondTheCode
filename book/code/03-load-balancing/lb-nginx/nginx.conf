worker_processes 1;
pid d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/nginx-lb.pid;
error_log d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/mime.types;
    default_type application/octet-stream;

    fastcgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/fastcgi_temp;
    uwsgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/uwsgi_temp;
    scgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/scgi_temp;
    client_body_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/client_body_temp;
    proxy_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/proxy_temp;

    access_log d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/03-load-balancing/lb-nginx/access.log;

    upstream formforge_api {
        # max_fails=3: mark a backend down after 3 failed proxied requests.
        # fail_timeout=10s: the window in which failures are counted, and how
        # long a backend stays down once marked.
        # NB: `proxy_next_upstream http_500` below is what makes a backend
        # that *returns* 500 count as a failure — by default Nginx only
        # counts connection-level errors/timeouts, and a backend returning
        # 500 would never be excluded.
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;

        # Round robin is the default (no directive needed).
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 64k;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive to upstreams needs HTTP/1.1 + cleared Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Count HTTP 500 as an upstream failure so max_fails can mark a
        # crashing backend down — by default Nginx only counts
        # connection-level errors/timeouts, and a backend returning 500
        # would NEVER be excluded. `tries 1` disables the retry so the
        # 500 is returned to the client as-is (no retry amplification,
        # see Ch 12, Retries).
        proxy_next_upstream error timeout http_500;
        proxy_next_upstream_tries 1;

        location /healthz {
            access_log off;
            return 200 "lb ok";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://formforge_api;
        }
    }
}
