apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: formforge-api
  namespace: argocd
  labels:
    app: formforge-api
    app.kubernetes.io/name: formforge-api
    app.kubernetes.io/part-of: formforge
spec:
  project: default
  source:
    repoURL: https://github.com/formforge/beyondthecode.git
    targetRevision: HEAD
    path: book/code/06-ci-cd/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2