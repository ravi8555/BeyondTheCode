# Chapter 04 — host-level standalone Nginx config (no Docker).
# `nginx -c <this file> -t` validates; `nginx -c <this file>` runs.
# Same policy as nginx/docker-nginx.conf; only the upstream address differs:
# host-level shares one loopback (127.0.0.1:3001), Compose uses `api:3001`.

worker_processes 1;
pid d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/nginx.pid;
error_log d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/mime.types;
    default_type application/octet-stream;

    fastcgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/fastcgi_temp;
    uwsgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/uwsgi_temp;
    scgi_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/scgi_temp;
    client_body_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/client_body_temp;
    proxy_temp_path d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/proxy_temp;

    log_format rp '$remote_addr - $request_id "$request" $status '
                 'up=$upstream_addr us=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log d:/practice/GenAI-2026/projects/BeyondTheCode/book/code/04-reverse-proxies/rp-nginx/access.log rp;

    upstream formforge_api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    server {
        listen 8090;
        server_name _;

        client_max_body_size 256k;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_set_header X-Request-Id $request_id;
        add_header X-Request-Id $request_id always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "proxy ok";
        }

        location /api/ {
            proxy_pass http://formforge_api;
        }

        location = / {
            default_type text/plain;
            return 200 "formforge: create forms people love filling out";
        }

        location = /ws {
            proxy_pass http://formforge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }
}
