services:
  # ---- Nginx reverse proxy (open source) ----
  proxy:
    image: nginx:1.24-alpine
    ports:
      - "8080:8080"
    volumes:
      # Docker's nginx image provides the main config; this snippet is the
      # conf.d server. Host-level runs use rp-nginx/nginx.conf instead.
      - ./nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

  # ---- Single FormForge API backend ----
  # Build: full install → tsc → prune (same pattern as Chapter 03).
  api:
    build: .
    environment:
      PORT: 3001
      TRUST_PROXY: loopback
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
