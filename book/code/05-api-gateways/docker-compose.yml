services:
  # ---- Redis (rate-limit backing store) ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ---- API Gateway (this chapter) ----
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      TRUST_PROXY: loopback
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-256-bit-secret-here
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      UPSTREAM_REQUEST_TIMEOUT_MS: 10000
      MAX_REQUEST_BODY_BYTES: 1048576
      UPSTREAM_FORMS: http://forms-stub:3001
      UPSTREAM_SUBMISSIONS: http://submissions-stub:3002
      UPSTREAM_WEBHOOKS: http://webhooks-stub:3003
    depends_on:
      redis:
        condition: service_started
      forms-stub:
        condition: service_started
      submissions-stub:
        condition: service_started
      webhooks-stub:
        condition: service_started

  # ---- Stub backends (stand in for real services) ----
  # Each stub echoes its name so tests can assert routing reached the right service.
  forms-stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    environment:
      PORT: 3001
      SERVICE_NAME: forms
  submissions-stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    environment:
      PORT: 3002
      SERVICE_NAME: submissions
  webhooks-stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    environment:
      PORT: 3003
      SERVICE_NAME: webhooks
